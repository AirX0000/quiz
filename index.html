<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizBlast ⚡</title>
<style>
:root {
  --bg: #0d0d1a; --surface: #161628; --surface2: #1e1e38;
  --accent: #7c3aed; --accent2: #06b6d4; --accent3: #f59e0b;
  --green: #10b981; --red: #ef4444;
  --text: #f1f5f9; --muted: #94a3b8; --border: rgba(255,255,255,0.08);
  --c1:#7c3aed;--c2:#06b6d4;--c3:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,.15),transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(6,182,212,.1),transparent 50%);pointer-events:none;z-index:0;}
.page{display:none;position:relative;z-index:1;}
.page.active{display:flex;flex-direction:column;min-height:100vh;}

/* BUTTONS */
.btn{font-family:system-ui,sans-serif;font-weight:800;font-size:1rem;padding:.85rem 2rem;border:none;border-radius:16px;cursor:pointer;transition:all .2s;}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 30px rgba(124,58,237,.4);}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-accent2{background:var(--accent2);color:#0d0d1a;box-shadow:0 8px 30px rgba(6,182,212,.35);}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:.5rem 1.1rem;font-size:.85rem;border-radius:10px;}
.btn:disabled{opacity:.35;cursor:default;transform:none;}

/* INPUTS */
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem;color:var(--text);font-family:system-ui,sans-serif;font-size:1rem;width:100%;transition:border-color .2s;}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.2);}
label{font-weight:700;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.4rem;}
[contenteditable][data-ph]:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none;}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:2rem;width:100%;max-width:660px;max-height:92vh;overflow-y:auto;}
.modal h2{font-weight:900;font-size:1.25rem;margin-bottom:1.5rem;}
.form-group{margin-bottom:1.2rem;}
.modal-actions{display:flex;gap:1rem;margin-top:1.5rem;justify-content:flex-end;}

/* TOAST */
.toast{position:fixed;top:1.5rem;right:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.5rem;font-weight:700;z-index:200;transform:translateX(200%);transition:transform .3s;max-width:300px;}
.toast.show{transform:translateX(0);}
.toast.success{border-color:var(--green);color:var(--green);}
.toast.error{border-color:var(--red);color:var(--red);}

/* ===== SPLASH ===== */
#splash{align-items:center;justify-content:center;text-align:center;padding:2rem;gap:2rem;}
.logo{font-size:clamp(2.5rem,8vw,5rem);font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tagline{color:var(--muted);font-size:1.1rem;margin-top:-.8rem;}
.splash-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}

/* ===== STUDENT QUIZ LIST ===== */
#student-home{padding:1.5rem;max-width:800px;margin:0 auto;width:100%;gap:1.5rem;}
.page-header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
.page-header h1{font-weight:900;font-size:1.4rem;}
.back-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:.5rem 1rem;border-radius:10px;cursor:pointer;font-size:.9rem;font-family:system-ui,sans-serif;font-weight:600;transition:all .2s;}
.back-btn:hover{color:var(--text);}
.quiz-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.5rem;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
.quiz-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.quiz-card:nth-child(3n+1)::before{background:var(--accent);}
.quiz-card:nth-child(3n+2)::before{background:var(--accent2);}
.quiz-card:nth-child(3n)::before{background:var(--accent3);}
.quiz-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.18);}
.qc-title{font-weight:900;font-size:1.1rem;margin-bottom:.5rem;}
.qc-meta{color:var(--muted);font-size:.85rem;display:flex;gap:.8rem;flex-wrap:wrap;}
.qc-badge{background:var(--surface2);border-radius:8px;padding:.2rem .6rem;font-size:.8rem;font-weight:700;}

/* ===== TEACHER DASHBOARD ===== */
#teacher{padding:1.5rem;gap:1.5rem;max-width:1000px;margin:0 auto;width:100%;}
.quiz-list-teacher{display:flex;flex-direction:column;gap:1rem;}
.tq-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.5rem;}
.tq-header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem;}
.tq-title{font-weight:900;font-size:1.1rem;flex:1;}
.tq-desc{color:var(--muted);font-size:.9rem;margin-bottom:.8rem;}
.tq-footer{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
.tq-count{color:var(--muted);font-size:.85rem;}

/* ===== QUESTION EDITOR (inside quiz) ===== */
#q-editor-page{padding:1.5rem;gap:1.5rem;max-width:900px;margin:0 auto;width:100%;}
.questions-list{display:flex;flex-direction:column;gap:1rem;}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.5rem;position:relative;overflow:hidden;}
.q-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:4px 0 0 4px;}
.q-number{font-size:.7rem;color:var(--muted);font-weight:700;margin-bottom:.4rem;text-transform:uppercase;}
.q-text{font-weight:700;font-size:1.05rem;margin-bottom:.8rem;}
.q-answers{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;}
.q-answer{padding:.45rem .8rem;border-radius:9px;font-size:.88rem;font-weight:600;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:.5rem;}
.q-answer.correct{border-color:var(--green);color:var(--green);background:rgba(16,185,129,.1);}
.q-actions{display:flex;gap:.5rem;margin-top:.8rem;}

/* ===== QUIZ PLAY ===== */
#quiz{padding:0;overflow:hidden;}
.quiz-header{background:var(--surface);border-bottom:1px solid var(--border);padding:.85rem 1.5rem;display:flex;align-items:center;gap:.75rem;position:relative;z-index:5;}
.quiz-nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:.4rem .75rem;cursor:pointer;font-size:1rem;transition:all .2s;flex-shrink:0;font-family:inherit;}
.quiz-nav-btn:hover:not(:disabled){color:var(--text);background:var(--accent);border-color:var(--accent);}
.quiz-nav-btn:disabled{opacity:.25;cursor:default;}
.quiz-progress-bar{flex:1;height:8px;background:var(--surface2);border-radius:100px;overflow:hidden;}
.quiz-progress-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease;}
.quiz-score-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0;}
.quiz-score-points{font-weight:700;font-size:1.05rem;color:var(--accent3);line-height:1;}
.quiz-score-correct{font-size:.75rem;font-weight:700;color:var(--green);line-height:1;}
.quiz-body{flex:1;display:flex;flex-direction:column;}
.quiz-image-wrap{width:100%;height:180px;overflow:hidden;position:relative;}
.quiz-image-wrap img{width:100%;height:100%;object-fit:cover;}
.quiz-image-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--bg));}
.quiz-question-wrap{padding:1.25rem 1.5rem;flex:1;display:flex;flex-direction:column;gap:.8rem;}
.quiz-q-label{color:var(--muted);font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.quiz-q-text{font-size:clamp(.95rem,3vw,1.3rem);font-weight:700;line-height:1.45;}
.timer-ring{position:relative;width:56px;height:56px;flex-shrink:0;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-ring .timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;}
.q-meta{display:flex;align-items:center;gap:1rem;}
.answers-grid-quiz{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;padding:0 1.5rem 1.5rem;}
.answer-btn{border:none;border-radius:18px;padding:1rem 1.2rem;cursor:pointer;font-family:system-ui,sans-serif;font-weight:800;font-size:1rem;display:flex;align-items:center;gap:.8rem;transition:all .2s;text-align:left;position:relative;overflow:hidden;}
.answer-btn:hover{transform:translateY(-2px);}
.answer-btn .ab-letter{width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;flex-shrink:0;}
.answer-btn.opt-a{background:var(--c1);color:#fff;box-shadow:0 6px 20px rgba(124,58,237,.4);}
.answer-btn.opt-b{background:var(--c2);color:#0d0d1a;box-shadow:0 6px 20px rgba(6,182,212,.35);}
.answer-btn.opt-c{background:var(--c3);color:#0d0d1a;box-shadow:0 6px 20px rgba(245,158,11,.35);}
.answer-btn.revealed-correct{background:var(--green)!important;color:#fff!important;box-shadow:0 6px 20px rgba(16,185,129,.5)!important;transform:scale(1.04);}
.answer-btn.revealed-wrong{background:var(--surface2)!important;color:var(--muted)!important;box-shadow:none!important;opacity:.5;}
.answer-btn.shake{animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.point-popup{position:fixed;top:80px;right:1.5rem;font-weight:900;font-size:1.8rem;color:var(--green);pointer-events:none;z-index:50;animation:pop-up 1s ease forwards;}
@keyframes pop-up{0%{opacity:0;transform:translateY(0) scale(.5);}20%{opacity:1;transform:translateY(-10px) scale(1.2);}80%{opacity:1;transform:translateY(-30px) scale(1);}100%{opacity:0;transform:translateY(-50px) scale(.9);}}

/* ===== RESULTS ===== */
#results{align-items:center;justify-content:center;padding:2rem;text-align:center;gap:2rem;}
.results-score{font-size:clamp(3rem,12vw,6rem);font-weight:900;background:linear-gradient(135deg,var(--accent3),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.results-breakdown{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center;}
.result-stat{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.5rem 2rem;min-width:110px;}
.result-stat .num{font-size:2rem;font-weight:700;}
.result-stat .lbl{color:var(--muted);font-size:.85rem;margin-top:.3rem;}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:50;}
.conf-dot{position:absolute;width:8px;height:8px;border-radius:2px;animation:conf-fall linear forwards;}
@keyframes conf-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* WAITING */
#waiting{align-items:center;justify-content:center;gap:2rem;text-align:center;padding:2rem;}
.spinner{width:64px;height:64px;border-radius:50%;border:4px solid var(--surface2);border-top-color:var(--accent);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ANSWERS EDITOR */
.answer-input-wrap{position:relative;}
.answer-letter{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.7rem;font-weight:700;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;}
.answer-input-wrap input{padding-left:44px;}
.correct-row{display:flex;gap:.5rem;margin-top:.5rem;}
.correct-btn{flex:1;padding:.6rem;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-family:system-ui,sans-serif;font-weight:700;font-size:.9rem;transition:all .2s;}
.correct-btn.selected{border-color:var(--green);color:var(--green);background:rgba(16,185,129,.1);}
.answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.5rem;}

.empty-state{text-align:center;padding:3rem;color:var(--muted);}
.empty-state .icon{font-size:3rem;margin-bottom:1rem;}
.empty-state h3{font-weight:900;font-size:1rem;margin-bottom:.5rem;color:var(--text);}

@media(max-width:500px){.answers-grid,.answers-grid-quiz{grid-template-columns:1fr;}.quiz-cards{grid-template-columns:1fr;}}

/* UTILITY CLASSES REPLACING INLINE STYLES */

.d-none { display: none; }
.w-0 { width: 0%; }

.splash-info { color: var(--muted); font-size: .9rem; max-width: 360px; line-height: 1.6; }
.page-col { flex-direction: column; }
.mt-1 { margin-top: 1rem; }
.header-actions { margin-left: auto; display: flex; gap: .6rem; flex-wrap: wrap; }
.waiting-title { font-weight: 700; font-size: 1.2rem; margin-bottom: .5rem; }
.text-muted { color: var(--muted); }
.q-counter-text { font-weight: 700; font-size: .9rem; white-space: nowrap; }
.flex-1 { flex: 1; }
.timer-arc { transition: stroke-dashoffset 1s linear; }
.results-emoji-wrap { font-size: 4rem; margin-bottom: .5rem; }
.results-label-wrap { color: var(--muted); font-size: 1.2rem; margin-top: -.5rem; }
.results-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
.max-w-400 { max-width: 400px; width: 100%; }
.max-w-460 { max-width: 460px; width: 100%; }
.login-setup-note { background: rgba(124,58,237,.12); border: 1px solid rgba(124,58,237,.3); border-radius: 12px; padding: .9rem 1rem; margin-bottom: 1.2rem; font-size: .88rem; color: #c4b5fd; line-height: 1.5; }
.relative { position: relative; }
.pass-toggle-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.1rem; width: auto; }
.error-msg { color: var(--red); font-size: .88rem; margin-bottom: .8rem; }
.ed-q-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: .75rem 1rem; min-height: 70px; outline: none; transition: border-color .2s; line-height: 1.5; font-size: 1rem; }
.bg-c1 { background: var(--c1); }
.bg-c2 { background: var(--c2); }
.bg-c3 { background: var(--c3); }
.col-span-2 { grid-column: span 2; }
</style>

</head>
<body>

<!-- ===== SPLASH ===== -->
<div id="splash" class="page active">
  <div><div class="logo">⚡ QuizBlast</div><div class="tagline">Живые квизы · Баллы · Удовольствие</div></div>
  <div class="splash-btns">
    <button class="btn btn-primary" onclick="openLoginModal()">👨‍🏫 Преподаватель</button>
    <button class="btn btn-accent2" onclick="showStudentHome()">🎓 Пройти квиз</button>
  </div>
  <div id="splash-info" class="splash-info"></div>
</div>

<!-- ===== STUDENT: QUIZ LIST ===== -->
<div id="student-home" class="page page-col">
  <div class="page-header">
    <button class="back-btn" onclick="showPage('splash')">← Назад</button>
    <h1>Выбери квиз</h1>
  </div>
  <div id="student-quiz-cards" class="quiz-cards mt-1"></div>
</div>

<!-- ===== TEACHER DASHBOARD ===== -->
<div id="teacher" class="page page-col">
  <div class="page-header">
    <button class="back-btn" onclick="logoutTeacher()">← Выйти</button>
    <h1>Мои квизы</h1>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="openChangePassModal()">🔑 Пароль</button>
      <button class="btn btn-primary btn-sm" onclick="openNewQuizModal()">＋ Новый квиз</button>
    </div>
  </div>
  <div id="teacher-quiz-list" class="quiz-list-teacher"></div>
</div>

<!-- ===== QUESTION EDITOR PAGE ===== -->
<div id="q-editor-page" class="page page-col">
  <div class="page-header">
    <button class="back-btn" onclick="showPage('teacher')">← К квизам</button>
    <h1 id="qep-title">Вопросы квиза</h1>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="openQEditor(-1)">＋ Вопрос</button>
      <button class="btn btn-primary btn-sm" onclick="startQuizFromEditor()" id="qep-start-btn">▶ Запустить</button>
    </div>
  </div>
  <div id="q-list" class="questions-list"></div>
</div>

<!-- ===== WAITING ===== -->
<div id="waiting" class="page page-col">
  <div class="spinner"></div>
  <div><div class="waiting-title">Загружаем картинку…</div><div class="text-muted">Подбираем изображение</div></div>
</div>

<!-- ===== QUIZ ===== -->
<div id="quiz" class="page page-col">
  <div class="quiz-header">
    <button class="quiz-nav-btn" id="prev-btn" onclick="goToPrev()">◀</button>
    <div class="q-counter-text" id="q-counter">1/1</div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-progress" class="w-0"></div></div>
    <div class="quiz-score-wrap">
      <div class="quiz-score-points" id="quiz-score-pts">0 ⭐</div>
      <div class="quiz-score-correct" id="quiz-score-cor">0 из 0</div>
    </div>
  </div>
  <div class="quiz-body">
    <div class="quiz-image-wrap"><img id="quiz-img" src="" alt=""><div class="quiz-image-overlay"></div></div>
    <div class="quiz-question-wrap">
      <div class="q-meta">
        <div class="flex-1">
          <div class="quiz-q-label" id="quiz-q-label">Вопрос</div>
          <div class="quiz-q-text" id="quiz-q-text"></div>
        </div>
        <div class="timer-ring">
          <svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--surface2)" stroke-width="5"/><circle id="timer-arc" cx="28" cy="28" r="24" fill="none" stroke="var(--accent2)" stroke-width="5" stroke-dasharray="150.8" stroke-dashoffset="0" stroke-linecap="round" class="timer-arc"/></svg>
          <div class="timer-text" id="timer-text">20</div>
        </div>
      </div>
    </div>
  </div>
  <div class="answers-grid-quiz" id="answers-grid-quiz"></div>
</div>

<!-- ===== RESULTS ===== -->
<div id="results" class="page page-col">
  <div class="confetti-wrap" id="confetti"></div>
  <div>
    <div class="results-emoji-wrap" id="results-emoji">🎉</div>
    <div class="results-score" id="results-score">0</div>
    <div class="results-label-wrap" id="results-label">баллов</div>
  </div>
  <div class="results-breakdown" id="results-breakdown"></div>
  <div class="results-actions">
    <button class="btn btn-primary" id="res-retry-btn" onclick="retryCurrentQuiz()">🔁 Ещё раз</button>
    <button class="btn btn-secondary" onclick="showStudentHome()">📋 Все квизы</button>
    <button class="btn btn-secondary" onclick="showPage('splash')">🏠 Главная</button>
  </div>
</div>

<!-- ===== MODALS ===== -->

<!-- LOGIN -->
<div class="modal-overlay hidden" id="login-modal">
  <div class="modal" class="max-w-400">
    <h2>🔐 Вход для преподавателя</h2>
    <div id="login-setup-note" class="login-setup-note d-none">👋 Первый вход! Придумайте логин и пароль.</div>
    <div class="form-group"><label>Логин</label><input type="text" id="login-user" placeholder="Логин" autocomplete="username"></div>
    <div class="form-group"><label>Пароль</label>
      <div class="relative">
        <input type="password" id="login-pass" placeholder="Пароль" onkeydown="if(event.key==='Enter')doLogin()">
        <button onclick="togglePass('login-pass',this)" class="pass-toggle-btn">👁</button>
      </div>
    </div>
    <div id="login-err" class="error-msg d-none"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('login-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="doLogin()" id="login-submit">Войти</button>
    </div>
  </div>
</div>

<!-- CHANGE PASS -->
<div class="modal-overlay hidden" id="cp-modal">
  <div class="modal" class="max-w-400">
    <h2>🔑 Сменить пароль</h2>
    <div class="form-group"><label>Текущий пароль</label><input type="password" id="cp-old"></div>
    <div class="form-group"><label>Новый пароль</label><input type="password" id="cp-new" placeholder="Мин. 4 символа"></div>
    <div class="form-group"><label>Повторите</label><input type="password" id="cp-confirm"></div>
    <div id="cp-err" class="error-msg d-none"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('cp-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="doChangePass()">Сохранить</button>
    </div>
  </div>
</div>

<!-- NEW / EDIT QUIZ -->
<div class="modal-overlay hidden" id="quiz-modal">
  <div class="modal" class="max-w-460">
    <h2 id="quiz-modal-title">Новый квиз</h2>
    <div class="form-group"><label>Название квиза</label><input type="text" id="qm-name" placeholder="Например: История России"></div>
    <div class="form-group"><label>Описание (необязательно)</label><input type="text" id="qm-desc" placeholder="Краткое описание темы"></div>
    <div id="qm-err" class="error-msg d-none"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('quiz-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="saveQuizMeta()">Сохранить</button>
    </div>
  </div>
</div>

<!-- QUESTION EDITOR -->
<div class="modal-overlay hidden" id="q-modal">
  <div class="modal">
    <h2 id="q-modal-title">Новый вопрос</h2>
    <div class="form-group">
      <label>Текст вопроса</label>
      <div id="ed-q" contenteditable="true" data-ph="Например: Что является столицей Франции?"
        class="ed-q-box"
        onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'"></div>
    </div>
    <div class="form-group">
      <label>Варианты ответов</label>
      <div class="answers-grid">
        <div class="answer-input-wrap"><div class="answer-letter" class="bg-c1">A</div><input type="text" id="ed-a" placeholder="Вариант A"></div>
        <div class="answer-input-wrap"><div class="answer-letter" class="bg-c2">B</div><input type="text" id="ed-b" placeholder="Вариант B"></div>
        <div class="answer-input-wrap" class="col-span-2"><div class="answer-letter" class="bg-c3">C</div><input type="text" id="ed-c" placeholder="Вариант C"></div>
      </div>

    <div class="form-group">
      <label>Правильный ответ</label>
      <div class="correct-row">
        <button class="correct-btn" id="cb-0" onclick="selCorrect(0)">A</button>
        <button class="correct-btn" id="cb-1" onclick="selCorrect(1)">B</button>
        <button class="correct-btn" id="cb-2" onclick="selCorrect(2)">C</button>
      </div>
    </div>
    <div class="form-group">
      <label>Ключевое слово для картинки (en)</label>
      <input type="text" id="ed-kw" placeholder="ocean, space, history...">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('q-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="saveQuestion()">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ======================================================
// DATA
// ======================================================
let quizzes = JSON.parse(localStorage.getItem('qb_quizzes') || '[]');
// quizzes[i] = { id, name, desc, questions: [{question,answers,correct,keyword}] }

function saveAll() { localStorage.setItem('qb_quizzes', JSON.stringify(quizzes)); }

// current editing context
let editingQuizId = null;
let editingQIdx = -1;
let selCorrectVal = 0;

// current playing context
let playQuizId = null;
let qState = { idx:0, score:0, correct:0, wrong:0, answered:false, history:[] };
let timerInt = null;

const UNSPLASH_KEY = 'DWZ8XIHVS9JJJEr_Nj4bdlHvvHSBT3D8QAEbOXuZl0';

// ======================================================
// PAGES
// ======================================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => { p.style.display='none'; p.classList.remove('active'); });
  const el = document.getElementById(id);
  el.style.display = 'flex';
  el.classList.add('active');
}

// ======================================================
// SPLASH
// ======================================================
function updateSplash() {
  const n = quizzes.length;
  document.getElementById('splash-info').textContent =
    n === 0 ? 'Квизов пока нет. Войдите как преподаватель, чтобы создать первый!'
            : `📋 Доступно квизов: ${n}. Нажмите «Пройти квиз», чтобы выбрать.`;
}

// ======================================================
// STUDENT HOME
// ======================================================
function showStudentHome() {
  renderStudentCards();
  showPage('student-home');
}

function renderStudentCards() {
  const wrap = document.getElementById('student-quiz-cards');
  if (quizzes.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="icon">🎓</div><h3>Пока нет квизов</h3><p>Преподаватель ещё не создал ни одного квиза</p></div>`;
    return;
  }
  wrap.innerHTML = quizzes.map(q => `
    <div class="quiz-card" onclick="startQuizAsStudent('${q.id}')">
      <div class="qc-title">${q.name}</div>
      ${q.desc ? `<div class="qc-meta" style="margin-bottom:.5rem;">${q.desc}</div>` : ''}
      <div class="qc-meta">
        <span class="qc-badge">📝 ${q.questions.length} вопр.</span>
        <span class="qc-badge">⏱ ~${q.questions.length * 20} сек</span>
      </div>
    </div>
  `).join('');
}

function startQuizAsStudent(quizId) {
  playQuizId = quizId;
  qState = { idx:0, score:0, correct:0, wrong:0, answered:false, history:[] };
  loadQuestion();
}

// ======================================================
// AUTH
// ======================================================
async function hashStr(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const getCreds = () => JSON.parse(localStorage.getItem('qb_creds') || 'null');

function openLoginModal() {
  const creds = getCreds();
  document.getElementById('login-setup-note').style.display = creds ? 'none' : 'block';
  document.getElementById('login-submit').textContent = creds ? 'Войти' : 'Создать и войти';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-err').style.display = 'none';
  openModal('login-modal');
  setTimeout(() => document.getElementById('login-user').focus(), 100);
}

async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  if (!u || !p) { errEl.textContent='Заполните все поля'; errEl.style.display='block'; return; }
  const creds = getCreds();
  const h = await hashStr(p);
  if (!creds) {
    if (p.length < 4) { errEl.textContent='Пароль минимум 4 символа'; errEl.style.display='block'; return; }
    localStorage.setItem('qb_creds', JSON.stringify({username:u, password:h}));
    closeModal('login-modal'); renderTeacher(); showPage('teacher');
    toast('Аккаунт создан! 🎉', 'success');
  } else {
    if (creds.username===u && creds.password===h) {
      closeModal('login-modal'); renderTeacher(); showPage('teacher');
      toast(`С возвращением, ${u}! 👋`, 'success');
    } else { errEl.textContent='Неверный логин или пароль'; errEl.style.display='block'; }
  }
}

function logoutTeacher() { showPage('splash'); updateSplash(); }

function openChangePassModal() {
  ['cp-old','cp-new','cp-confirm'].forEach(id => document.getElementById(id).value='');
  document.getElementById('cp-err').style.display='none';
  openModal('cp-modal');
}

async function doChangePass() {
  const oldP=document.getElementById('cp-old').value, newP=document.getElementById('cp-new').value, conf=document.getElementById('cp-confirm').value;
  const errEl=document.getElementById('cp-err'); errEl.style.display='none';
  const creds=getCreds(); const oh=await hashStr(oldP);
  if(creds.password!==oh){errEl.textContent='Текущий пароль неверен';errEl.style.display='block';return;}
  if(newP.length<4){errEl.textContent='Мин. 4 символа';errEl.style.display='block';return;}
  if(newP!==conf){errEl.textContent='Пароли не совпадают';errEl.style.display='block';return;}
  localStorage.setItem('qb_creds', JSON.stringify({username:creds.username, password:await hashStr(newP)}));
  closeModal('cp-modal'); toast('Пароль изменён ✓','success');
}

function togglePass(id,btn){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password';btn.textContent=el.type==='password'?'👁':'🙈';}

// ======================================================
// TEACHER: QUIZ MANAGEMENT
// ======================================================
function renderTeacher() {
  const wrap = document.getElementById('teacher-quiz-list');
  if (quizzes.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="icon">📋</div><h3>Нет квизов</h3><p>Нажмите «+ Новый квиз», чтобы создать первый</p></div>`;
    return;
  }
  wrap.innerHTML = quizzes.map(q => `
    <div class="tq-card">
      <div class="tq-header">
        <div class="tq-title">${q.name}</div>
        <button class="btn btn-secondary btn-sm" onclick="openEditQuizModal('${q.id}')">✏️ Изменить</button>
        <button class="btn btn-danger btn-sm" onclick="deleteQuiz('${q.id}')">🗑</button>
      </div>
      ${q.desc ? `<div class="tq-desc">${q.desc}</div>` : ''}
      <div class="tq-footer">
        <span class="tq-count">📝 ${q.questions.length} вопросов</span>
        <button class="btn btn-secondary btn-sm" onclick="openQEditorPage('${q.id}')">📋 Редактировать вопросы</button>
        <button class="btn btn-primary btn-sm" onclick="startQuizAsStudent('${q.id}');showPage('waiting')">▶ Запустить</button>
      </div>
    </div>
  `).join('');
}

let editingQuizMetaId = null;
function openNewQuizModal() {
  editingQuizMetaId = null;
  document.getElementById('quiz-modal-title').textContent = 'Новый квиз';
  document.getElementById('qm-name').value = '';
  document.getElementById('qm-desc').value = '';
  document.getElementById('qm-err').style.display = 'none';
  openModal('quiz-modal');
  setTimeout(()=>document.getElementById('qm-name').focus(),100);
}
function openEditQuizModal(id) {
  const q = quizzes.find(x=>x.id===id);
  editingQuizMetaId = id;
  document.getElementById('quiz-modal-title').textContent = 'Редактировать квиз';
  document.getElementById('qm-name').value = q.name;
  document.getElementById('qm-desc').value = q.desc || '';
  document.getElementById('qm-err').style.display = 'none';
  openModal('quiz-modal');
}
function saveQuizMeta() {
  const name = document.getElementById('qm-name').value.trim();
  const desc = document.getElementById('qm-desc').value.trim();
  const errEl = document.getElementById('qm-err'); errEl.style.display='none';
  if (!name) { errEl.textContent='Введите название'; errEl.style.display='block'; return; }
  if (editingQuizMetaId) {
    const q = quizzes.find(x=>x.id===editingQuizMetaId);
    q.name=name; q.desc=desc;
  } else {
    quizzes.push({ id: uid(), name, desc, questions:[] });
  }
  saveAll(); closeModal('quiz-modal'); renderTeacher();
  toast(editingQuizMetaId ? 'Квиз обновлён ✓' : 'Квиз создан ✓', 'success');
}
function deleteQuiz(id) {
  if (!confirm('Удалить квиз и все его вопросы?')) return;
  quizzes = quizzes.filter(x=>x.id!==id);
  saveAll(); renderTeacher(); toast('Квиз удалён','success');
}

// ======================================================
// QUESTION EDITOR PAGE
// ======================================================
function openQEditorPage(quizId) {
  editingQuizId = quizId;
  const q = quizzes.find(x=>x.id===quizId);
  document.getElementById('qep-title').textContent = q.name;
  renderQList();
  showPage('q-editor-page');
}

function renderQList() {
  const q = quizzes.find(x=>x.id===editingQuizId);
  const wrap = document.getElementById('q-list');
  document.getElementById('qep-start-btn').disabled = q.questions.length === 0;
  if (q.questions.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="icon">❓</div><h3>Нет вопросов</h3><p>Нажмите «+ Вопрос»</p></div>`;
    return;
  }
  wrap.innerHTML = q.questions.map((qq,i) => `
    <div class="q-card">
      <div class="q-number">Вопрос ${i+1}</div>
      <div class="q-text">${qq.question}</div>
      <div class="q-answers">
        ${qq.answers.map((a,j)=>`<div class="q-answer ${j===qq.correct?'correct':''}"><b>${'ABC'[j]}</b> ${a}</div>`).join('')}
      </div>
      <div class="q-actions">
        <button class="btn btn-secondary btn-sm" onclick="openQEditor(${i})">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteQ(${i})">🗑</button>
      </div>
    </div>
  `).join('');
}

function openQEditor(idx) {
  editingQIdx = idx;
  const q = quizzes.find(x=>x.id===editingQuizId);
  const qq = idx >= 0 ? q.questions[idx] : null;
  document.getElementById('q-modal-title').textContent = idx >= 0 ? 'Изменить вопрос' : 'Новый вопрос';
  document.getElementById('ed-q').innerHTML = qq ? qq.question : '';
  document.getElementById('ed-a').value = qq ? qq.answers[0] : '';
  document.getElementById('ed-b').value = qq ? qq.answers[1] : '';
  document.getElementById('ed-c').value = qq ? qq.answers[2] : '';
  document.getElementById('ed-kw').value = qq ? (qq.keyword||'') : '';
  selCorrectVal = qq ? qq.correct : 0;
  updateCorrectBtns();
  openModal('q-modal');
}

function selCorrect(i) { selCorrectVal=i; updateCorrectBtns(); }
function updateCorrectBtns() {
  [0,1,2].forEach(i=>document.getElementById('cb-'+i).classList.toggle('selected',i===selCorrectVal));
}

function saveQuestion() {
  const question = document.getElementById('ed-q').innerHTML.trim();
  const a=document.getElementById('ed-a').value.trim();
  const b=document.getElementById('ed-b').value.trim();
  const c=document.getElementById('ed-c').value.trim();
  const kw=document.getElementById('ed-kw').value.trim();
  const strip=s=>s.replace(/<[^>]+>/g,'').trim();
  if(!strip(question)||!a||!b||!c){toast('Заполните все поля!','error');return;}
  const q = quizzes.find(x=>x.id===editingQuizId);
  const obj={question,answers:[a,b,c],correct:selCorrectVal,keyword:kw};
  if(editingQIdx>=0) q.questions[editingQIdx]=obj; else q.questions.push(obj);
  saveAll(); closeModal('q-modal'); renderQList();
  toast(editingQIdx>=0?'Вопрос обновлён ✓':'Вопрос добавлен ✓','success');
}

function deleteQ(i) {
  const q=quizzes.find(x=>x.id===editingQuizId);
  q.questions.splice(i,1); saveAll(); renderQList(); toast('Вопрос удалён','success');
}

function startQuizFromEditor() {
  startQuizAsStudent(editingQuizId);
}

// ======================================================
// QUIZ ENGINE
// ======================================================
async function loadQuestion() {
  showPage('waiting');
  const quiz = quizzes.find(x=>x.id===playQuizId);
  const qq = quiz.questions[qState.idx];
  let imgUrl = `https://source.unsplash.com/1200x400/?${encodeURIComponent(qq.keyword||'education')}&sig=${qState.idx}`;
  try {
    const res = await fetch(`https://api.unsplash.com/photos/random?query=${encodeURIComponent(qq.keyword||'education')}&orientation=landscape&client_id=${UNSPLASH_KEY}`);
    if(res.ok){const d=await res.json();imgUrl=d.urls.regular;}
  } catch(e){}
  if(!qState.history[qState.idx]) qState.history[qState.idx]={imgUrl,chosen:null};
  else qState.history[qState.idx].imgUrl = qState.history[qState.idx].imgUrl||imgUrl;
  renderQuestion(quiz, qState.history[qState.idx].imgUrl);
}

function renderQuestion(quiz, imgUrl) {
  const snap = qState.history[qState.idx];
  const already = snap && snap.chosen !== null;
  qState.answered = already;
  const qq = quiz.questions[qState.idx];
  const total = quiz.questions.length;

  document.getElementById('q-counter').textContent = `${qState.idx+1}/${total}`;
  document.getElementById('quiz-progress').style.width = `${(qState.idx/total)*100}%`;
  document.getElementById('prev-btn').disabled = qState.idx===0;
  updateScoreUI();
  document.getElementById('quiz-q-label').textContent = `Вопрос ${qState.idx+1} из ${total} · ${quiz.name}`;
  document.getElementById('quiz-q-text').innerHTML = qq.question;
  document.getElementById('quiz-img').src = imgUrl;

  const grid = document.getElementById('answers-grid-quiz');
  grid.innerHTML = qq.answers.map((a,i)=>`
    <button class="answer-btn opt-${'abc'[i]}" onclick="chooseAns(${i})" id="ab-${i}">
      <span class="ab-letter">${'ABC'[i]}</span><span>${a}</span>
    </button>
  `).join('');

  if(already){ revealAnswers(snap.chosen); clearInterval(timerInt); document.getElementById('timer-arc').style.strokeDashoffset=150.8; document.getElementById('timer-text').textContent='–'; }
  else startTimer();
  showPage('quiz');
}

function updateScoreUI() {
  document.getElementById('quiz-score-pts').textContent = `${qState.score} ⭐`;
  document.getElementById('quiz-score-cor').textContent = `${qState.correct} из ${qState.correct+qState.wrong}`;
}

function startTimer() {
  clearInterval(timerInt);
  let t=20;
  const arc=document.getElementById('timer-arc'), txt=document.getElementById('timer-text');
  arc.style.stroke='var(--accent2)';
  arc.style.strokeDashoffset=0; txt.textContent=20;
  timerInt = setInterval(()=>{
    t--;
    arc.style.strokeDashoffset = 150.8-(t/20)*150.8;
    txt.textContent=t;
    if(t<=5) arc.style.stroke='var(--red)';
    if(t<=0){clearInterval(timerInt);if(!qState.answered)autoReveal();}
  },1000);
}

function autoReveal() {
  qState.answered=true; qState.wrong++;
  qState.history[qState.idx].chosen='timeout';
  updateScoreUI(); revealAnswers(-1);
  setTimeout(nextQ, 2000);
}

function chooseAns(i) {
  if(qState.answered) return;
  qState.answered=true; clearInterval(timerInt);
  const quiz=quizzes.find(x=>x.id===playQuizId);
  const qq=quiz.questions[qState.idx];
  if(i===qq.correct){qState.score++;qState.correct++;showPointPopup('+1');}
  else{qState.wrong++;document.getElementById('ab-'+i).classList.add('shake');}
  qState.history[qState.idx].chosen=i;
  updateScoreUI(); revealAnswers(i);
  setTimeout(nextQ,2000);
}

function revealAnswers(chosen) {
  const quiz=quizzes.find(x=>x.id===playQuizId);
  const qq=quiz.questions[qState.idx];
  for(let i=0;i<3;i++){
    const b=document.getElementById('ab-'+i); if(!b) continue;
    b.onclick=null;
    if(i===qq.correct) b.classList.add('revealed-correct');
    else b.classList.add('revealed-wrong');
  }
}

function nextQ() {
  const quiz=quizzes.find(x=>x.id===playQuizId);
  qState.idx++;
  if(qState.idx>=quiz.questions.length){showResults();return;}
  loadQuestion();
}

function goToPrev() {
  if(qState.idx===0) return;
  clearInterval(timerInt); qState.idx--;
  const snap=qState.history[qState.idx];
  const quiz=quizzes.find(x=>x.id===playQuizId);
  renderQuestion(quiz, snap ? snap.imgUrl : '');
  document.getElementById('prev-btn').disabled = qState.idx===0;
}

function showResults() {
  const quiz=quizzes.find(x=>x.id===playQuizId);
  const total=quiz.questions.length;
  const pct=Math.round((qState.correct/total)*100);
  document.getElementById('results-score').textContent=qState.score;
  document.getElementById('results-label').textContent=`балл${qState.score===1?'':qState.score<5?'а':'ов'} из ${total}`;
  document.getElementById('results-emoji').textContent=pct>=80?'🏆':pct>=50?'🎉':pct>=30?'😊':'💪';
  document.getElementById('results-breakdown').innerHTML=`
    <div class="result-stat"><div class="num" style="color:var(--green)">${qState.correct}</div><div class="lbl">Правильных</div></div>
    <div class="result-stat"><div class="num" style="color:var(--red)">${qState.wrong}</div><div class="lbl">Неверных</div></div>
    <div class="result-stat"><div class="num" style="color:var(--accent3)">${qState.score}</div><div class="lbl">Баллов</div></div>
    <div class="result-stat"><div class="num" style="color:var(--accent2)">${pct}%</div><div class="lbl">Точность</div></div>
  `;
  showPage('results');
  if(pct>=50) launchConfetti();
}

function retryCurrentQuiz() {
  qState={idx:0,score:0,correct:0,wrong:0,answered:false,history:[]};
  loadQuestion();
}

function showPointPopup(t) {
  const p=document.createElement('div'); p.className='point-popup'; p.textContent=t;
  document.body.appendChild(p); setTimeout(()=>p.remove(),1100);
}

function launchConfetti() {
  const wrap=document.getElementById('confetti'); wrap.innerHTML='';
  const cols=['#7c3aed','#06b6d4','#f59e0b','#10b981','#ef4444','#ec4899'];
  for(let i=0;i<70;i++){
    const d=document.createElement('div'); d.className='conf-dot';
    d.style.left=Math.random()*100+'vw'; d.style.background=cols[Math.floor(Math.random()*cols.length)];
    d.style.animationDuration=(1.5+Math.random()*2)+'s'; d.style.animationDelay=Math.random()*1.5+'s';
    wrap.appendChild(d);
  } setTimeout(()=>wrap.innerHTML='',4500);
}

// ======================================================
// UTILS
// ======================================================
function openModal(id){document.getElementById(id).classList.remove('hidden');}
function closeModal(id){document.getElementById(id).classList.add('hidden');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>t.classList.remove('show'),2500);}

// ======================================================
// INIT
// ======================================================
// Migrate old single-quiz format if needed
(function migrate(){
  const old=localStorage.getItem('qb_questions');
  if(old && quizzes.length===0){
    try{
      const qs=JSON.parse(old);
      if(qs.length>0){quizzes.push({id:uid(),name:'Мой первый квиз',desc:'Перенесено из старой версии',questions:qs});saveAll();}
    }catch(e){}
  }
})();
